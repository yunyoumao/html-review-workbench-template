<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Review Workbench Template</title>
  <script src="data/sample-review.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --ink: #162024;
      --muted: #647074;
      --line: #d9d7ce;
      --accent: #006c67;
      --accent-strong: #004c49;
      --warn: #9d5a00;
      --danger: #b42318;
      --ok: #237a46;
      --shadow: 0 18px 45px rgba(24, 32, 36, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(0, 108, 103, 0.28);
      outline-offset: 2px;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 24px 42px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      overflow-wrap: break-word;
    }

    .subtitle {
      max-width: 760px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      overflow-wrap: break-word;
    }

    .updated {
      min-width: 150px;
      color: var(--muted);
      text-align: right;
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1.4fr) repeat(3, minmax(120px, 0.7fr)) auto;
      gap: 10px;
      margin-top: 22px;
    }

    .toolbar input,
    .toolbar select,
    .toolbar button {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 10px;
    }

    .toolbar button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .toolbar button:hover {
      background: var(--accent-strong);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
    }

    .stat strong {
      display: block;
      font-size: 26px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 16px;
      margin-top: 18px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 18px;
    }

    .list {
      max-height: 650px;
      overflow: auto;
    }

    .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .item:hover,
    .item[aria-selected="true"] {
      background: #eef7f5;
    }

    .item-title {
      margin: 0;
      font-weight: 700;
      min-width: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .tag.high {
      color: var(--danger);
      border-color: #f1b8b3;
    }

    .tag.medium {
      color: var(--warn);
      border-color: #e6c381;
    }

    .tag.done {
      color: var(--ok);
      border-color: #a8d8b8;
    }

    .item-id {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail {
      padding: 18px;
    }

    .detail h3 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.18;
    }

    .detail dl {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 10px 12px;
      margin: 18px 0 0;
    }

    .detail dt {
      color: var(--muted);
      font-size: 13px;
    }

    .detail dd {
      margin: 0;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .shell {
        padding: 20px 14px 32px;
      }

      header,
      .workspace {
        grid-template-columns: 1fr;
        display: grid;
      }

      .updated {
        text-align: left;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar input,
      .toolbar button {
        grid-column: 1 / -1;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      .shell {
        max-width: 390px;
        margin: 0;
      }

      h1 {
        font-size: 26px;
      }

      .toolbar,
      .stats {
        grid-template-columns: 1fr;
      }

      .detail dl {
        grid-template-columns: 1fr;
      }

      .item {
        grid-template-columns: 1fr;
      }

      .item-id {
        order: -1;
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Local review workbench</p>
        <h1 id="title">Review Workbench</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="updated" id="updated"></div>
    </header>

    <section class="toolbar" aria-label="Review filters">
      <input id="search" type="search" placeholder="Search title, evidence, next step">
      <select id="status">
        <option value="">All statuses</option>
      </select>
      <select id="severity">
        <option value="">All severities</option>
      </select>
      <select id="category">
        <option value="">All categories</option>
      </select>
      <button id="export" type="button">Export JSON</button>
    </section>

    <section class="stats" aria-label="Review statistics" id="stats"></section>

    <section class="workspace">
      <section class="panel" aria-label="Review item list">
        <h2>Review Items</h2>
        <div class="list" id="list"></div>
      </section>
      <section class="panel" aria-label="Selected review item">
        <h2>Details</h2>
        <div class="detail" id="detail"></div>
      </section>
    </section>
  </main>

  <script>
    const data = window.REVIEW_WORKBENCH_DATA;
    const items = data.items;
    const state = {
      search: "",
      status: "",
      severity: "",
      category: "",
      selectedId: items[0]?.id || ""
    };

    const els = {
      title: document.querySelector("#title"),
      subtitle: document.querySelector("#subtitle"),
      updated: document.querySelector("#updated"),
      search: document.querySelector("#search"),
      status: document.querySelector("#status"),
      severity: document.querySelector("#severity"),
      category: document.querySelector("#category"),
      stats: document.querySelector("#stats"),
      list: document.querySelector("#list"),
      detail: document.querySelector("#detail"),
      export: document.querySelector("#export")
    };

    function uniqueValues(field) {
      return [...new Set(items.map(item => item[field]))].sort();
    }

    function fillSelect(select, values) {
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.append(option);
      });
    }

    function matches(item) {
      const text = `${item.id} ${item.title} ${item.category} ${item.owner} ${item.evidence} ${item.next_step}`.toLowerCase();
      return (!state.search || text.includes(state.search))
        && (!state.status || item.status === state.status)
        && (!state.severity || item.severity === state.severity)
        && (!state.category || item.category === state.category);
    }

    function filteredItems() {
      return items.filter(matches);
    }

    function severityClass(value) {
      return value.toLowerCase();
    }

    function statusClass(value) {
      return value === "Done" ? "done" : "";
    }

    function renderStats(current) {
      const open = current.filter(item => item.status === "Open").length;
      const progress = current.filter(item => item.status === "In Progress").length;
      const done = current.filter(item => item.status === "Done").length;
      const high = current.filter(item => item.severity === "High").length;
      const stats = [
        ["Items", current.length],
        ["Open", open],
        ["In progress", progress],
        ["Done", done],
        ["High severity", high]
      ];
      els.stats.innerHTML = stats.map(([label, value]) => `
        <div class="stat">
          <strong>${value}</strong>
          <span>${label}</span>
        </div>
      `).join("");
    }

    function renderList(current) {
      if (!current.length) {
        els.list.innerHTML = '<div class="empty">No items match the current filters.</div>';
        renderDetail(null);
        return;
      }

      if (!current.some(item => item.id === state.selectedId)) {
        state.selectedId = current[0].id;
      }

      els.list.innerHTML = current.map(item => `
        <button class="item" type="button" data-id="${item.id}" aria-selected="${item.id === state.selectedId}">
          <div>
            <p class="item-title">${item.title}</p>
            <div class="meta">
              <span class="tag ${severityClass(item.severity)}">${item.severity}</span>
              <span class="tag ${statusClass(item.status)}">${item.status}</span>
              <span class="tag">${item.category}</span>
              <span class="tag">${item.owner}</span>
            </div>
          </div>
          <span class="item-id">${item.id}</span>
        </button>
      `).join("");

      els.list.querySelectorAll(".item").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedId = button.dataset.id;
          render();
        });
      });

      renderDetail(current.find(item => item.id === state.selectedId));
    }

    function renderDetail(item) {
      if (!item) {
        els.detail.innerHTML = '<div class="empty">Select a review item to inspect details.</div>';
        return;
      }

      els.detail.innerHTML = `
        <h3>${item.title}</h3>
        <div class="meta">
          <span class="tag">${item.id}</span>
          <span class="tag ${severityClass(item.severity)}">${item.severity}</span>
          <span class="tag ${statusClass(item.status)}">${item.status}</span>
          <span class="tag">${item.category}</span>
        </div>
        <dl>
          <dt>Owner</dt><dd>${item.owner}</dd>
          <dt>Evidence</dt><dd>${item.evidence}</dd>
          <dt>Next step</dt><dd>${item.next_step}</dd>
        </dl>
      `;
    }

    function render() {
      const current = filteredItems();
      renderStats(current);
      renderList(current);
    }

    function exportFiltered() {
      const payload = JSON.stringify({ ...data, items: filteredItems() }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "filtered-review-items.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function init() {
      els.title.textContent = data.title;
      els.subtitle.textContent = data.subtitle;
      els.updated.textContent = `Updated ${data.updated}`;
      fillSelect(els.status, uniqueValues("status"));
      fillSelect(els.severity, uniqueValues("severity"));
      fillSelect(els.category, uniqueValues("category"));

      els.search.addEventListener("input", event => {
        state.search = event.target.value.trim().toLowerCase();
        render();
      });
      [els.status, els.severity, els.category].forEach(select => {
        select.addEventListener("change", event => {
          state[event.target.id] = event.target.value;
          render();
        });
      });
      els.export.addEventListener("click", exportFiltered);
      render();
    }

    init();
  </script>
</body>
</html>
